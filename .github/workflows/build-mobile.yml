name: Build & Deploy

on:
  push:
    branches:
      - web-version
    paths:
      - 'manifest.json'
      - 'reader/**'
      - '_locales/**'
      - 'scratch/**'
      - 'android/**'
      - 'ios/**'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ==========================================
  # Job 1: Android & Web Build (ubuntu-latest)
  # Runs concurrently with iOS build
  # ==========================================
  build-android-and-web:
    name: Build Android APK & Deploy Web
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./manifest.json','utf8')).version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
          # 同步版本號到 package.json
          node -e "const f='./package.json';const p=JSON.parse(require('fs').readFileSync(f,'utf8'));p.version='${VERSION}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      # ===== Offline Single-File Build =====
      - name: Build Offline Single-File Reader
        run: |
          npm run build:offline
          cp reader_offline.html "Raconteur-Offline-${{ steps.version.outputs.version }}.html"

      # ===== Chrome Extension Zip =====
      - name: Package Chrome Extension
        run: |
          mkdir -p chrome-ext
          cp manifest.json chrome-ext/
          cp service-worker.js chrome-ext/
          cp -r reader chrome-ext/
          cp -r _locales chrome-ext/
          cp -r icons chrome-ext/
          cd chrome-ext && zip -r "../Raconteur-Chrome-${{ steps.version.outputs.version }}.zip" . && cd ..

      # ===== Android APK Build =====
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web App and Sync
        run: npm run build:mobile

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy Versioned APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Raconteur-${{ steps.version.outputs.version }}.apk"

      - name: Upload Android & Web Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: android-web-artifacts
          path: |
            Raconteur-${{ steps.version.outputs.version }}.apk
            Raconteur-Offline-${{ steps.version.outputs.version }}.html
            Raconteur-Chrome-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7

      # ===== Deploy Web to GitHub Pages =====
      - name: Prepare Web Deploy
        run: |
          mkdir -p deploy
          cp -r reader deploy/
          cp -r icons deploy/
          cp -r _locales deploy/
          cp index.html deploy/
          cp manifest.webmanifest deploy/
          cp sw.js deploy/
          cp service-worker.js deploy/
          cp manifest.json deploy/

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true

  # ==========================================
  # Job 2: iOS IPA Build (macos-latest)
  # Runs concurrently with Job 1 (No dependency)
  # ==========================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./manifest.json','utf8')).version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building iOS IPA version: ${VERSION}"

      # ===== iOS IPA Build =====
      - name: Build iOS IPA
        run: npm run build:ipa

      - name: Prepare Versioned IPA
        run: |
          mv EdgeReader-iOS.ipa "EdgeReader-${{ steps.version.outputs.version }}-iOS.ipa"

      - name: Upload iOS Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: ios-artifacts
          path: EdgeReader-${{ steps.version.outputs.version }}-iOS.ipa
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # Job 3: Unified Release (ubuntu-latest)
  # Waits for both Android and iOS builds, then publishes all assets together
  # ==========================================
  create-release:
    name: Publish Unified Release
    runs-on: ubuntu-latest
    needs: [build-android-and-web, build-ios]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Display Release Files
        run: ls -lh release-files

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ needs.build-android-and-web.outputs.version }}"
          git push origin "v${{ needs.build-android-and-web.outputs.version }}" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Existing Release
        run: |
          gh release delete "v${{ needs.build-android-and-web.outputs.version }}" --yes --cleanup-tag || true
          git tag -f "v${{ needs.build-android-and-web.outputs.version }}"
          git push origin "v${{ needs.build-android-and-web.outputs.version }}" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-android-and-web.outputs.version }}
          files: release-files/*
          name: v${{ needs.build-android-and-web.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
