name: Build & Deploy

on:
  push:
    branches:
      - web-version
    paths:
      - 'manifest.json'
      - 'reader/**'
      - '_locales/**'
      - 'scratch/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build APK, Offline Reader & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./manifest.json','utf8')).version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
          # 同步版本號到 package.json
          node -e "const f='./package.json';const p=JSON.parse(require('fs').readFileSync(f,'utf8'));p.version='${VERSION}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      # ===== Offline Single-File Build =====
      - name: Build Offline Single-File Reader
        run: |
          npm run build:offline
          cp reader_offline.html "Raconteur-Offline-${{ steps.version.outputs.version }}.html"

      # ===== Commit Compiled Files Back to Repo =====
      - name: Commit Compiled Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html reader_offline.html package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): build single-file offline reader v${{ steps.version.outputs.version }} [skip ci]"
            git push origin web-version
          fi

      # ===== Android APK Build =====
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Web App and Sync
        run: npm run build:mobile

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Raconteur-${{ steps.version.outputs.version }}.apk

      - name: Upload Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            android/app/build/outputs/apk/debug/Raconteur-${{ steps.version.outputs.version }}.apk
            Raconteur-Offline-${{ steps.version.outputs.version }}.html
          if-no-files-found: error
          retention-days: 7

      # ===== Create Tag & Release =====
      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Existing Release
        run: |
          gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            android/app/build/outputs/apk/debug/Raconteur-${{ steps.version.outputs.version }}.apk
            Raconteur-Offline-${{ steps.version.outputs.version }}.html
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===== Deploy Web to GitHub Pages =====
      - name: Prepare Web Deploy
        run: |
          mkdir -p deploy
          cp -r reader deploy/
          cp -r icons deploy/
          cp -r _locales deploy/
          cp index.html deploy/
          cp reader_offline.html deploy/
          cp manifest.webmanifest deploy/
          cp sw.js deploy/
          cp service-worker.js deploy/
          cp manifest.json deploy/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

