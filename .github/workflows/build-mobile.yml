# Gated CI: validate -> android-build -> pages-deploy -> release-prerelease
# Every publication gate depends on full validation passing first.
name: Build & Release Mobile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'manifest.json'
      - 'manifest.webmanifest'
      - 'capacitor.config.json'
      - 'reader/**'
      - '_locales/**'
      - 'icons/**'
      - 'scratch/**'
      - 'test/**'
      - 'android/**'
      - 'index.html'
      - 'reader_offline.html'
      - 'sw.js'
      - 'server.js'
      - 'service-worker.js'
      - 'vercel.json'
      - '.github/workflows/**'
  workflow_dispatch:

# Top-level: restrict to minimum. Jobs declare their own needs.
permissions: {}

jobs:
  # ─── Gate 1: Full validation ───────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960  # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a0  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Check version consistency
        run: npm run check:versions
      - name: Run unit + security tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build offline artifact
        run: npm run build:offline
      - name: Build mobile artifact
        run: npm run build:mobile
      - name: Test built artifacts
        run: npm run test:artifacts
      - name: Verify no uncommitted generated files
        run: git diff --exit-code

  # ─── Gate 2: Android build ─────────────────────────────────────────
  android-build:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960  # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a0  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Build mobile artifact
        run: npm run build:mobile
      - name: Setup JDK
        uses: actions/setup-java@dded088  # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Sync Capacitor Android
        run: npm run sync:android
      - name: Run Gradle tests
        working-directory: android
        run: ./gradlew test
      - name: Run Gradle lint
        working-directory: android
        run: ./gradlew lint
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: |
          apk_src=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$apk_src" "Raconteur-${{ steps.version.outputs.version }}-debug-test.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46  # v7.0.1
        with:
          name: android-debug-apk
          path: 'Raconteur-${{ steps.version.outputs.version }}-debug-test.apk'
          retention-days: 14

  # ─── Gate 3: GitHub Pages deploy ───────────────────────────────────
  pages-deploy:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960  # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a0  # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (locked)
        run: npm ci
      - name: Build offline artifact
        run: npm run build:offline
      - name: Configure Pages
        uses: actions/configure-pages@983d773  # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-artifact@043fb46  # v7.0.1
        with:
          name: github-pages
          path: .
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db901  # v4.0.5

  # ─── Gate 4: Immutable prerelease ──────────────────────────────────
  release-prerelease:
    needs: [validate, android-build, pages-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960  # v4.4.0
        with:
          fetch-depth: 0
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
      - name: Fail if tag already exists
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Bump the version before releasing."
            exit 1
          fi
      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Release v${{ steps.version.outputs.version }} already exists. Bump the version before releasing."
            exit 1
          fi
      - name: Create immutable tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b  # v8.0.1
        with:
          name: android-debug-apk
      - name: Create prerelease
        uses: softprops/action-gh-release@3bb1273  # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }} (debug test build)
          prerelease: true
          body: |
            ## Debug / Test Build

            **This is an automated pre-release for testing purposes only.**
            It is NOT a production release.

            - APK: `Raconteur-${{ steps.version.outputs.version }}-debug-test.apk`
            - Build type: debug
            - Signed with: debug keystore (not suitable for distribution)

            ### What's included
            - Offline PWA artifact
            - Android debug APK (test-only)
            - All validation gates passed before publication
          files: |
            Raconteur-${{ steps.version.outputs.version }}-debug-test.apk
