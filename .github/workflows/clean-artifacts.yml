# Retain only: prune old workflow artifacts and runs.
# No release deletion. No tag deletion. No force operations.
name: Clean Old Artifacts

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly on Sunday at 04:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow artifacts (>30 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                || date -u -v-30d +%Y-%m-%dT%H:%M:%SZ)
          echo "Pruning artifacts older than $cutoff"
          page=1
          while true; do
            artifacts=$(gh api "repos/$REPO/actions/artifacts?per_page=100&page=$page" --jq '.artifacts[]')
            [ -z "$artifacts" ] && break
            echo "$artifacts" | jq -r --arg cutoff "$cutoff" \
              'select(.created_at < $cutoff) | .id' | while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
            done
            page=$((page + 1))
          done

  prune-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs (>60 days, not latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '60 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
                || date -u -v-60d +%Y-%m-%dT%H:%M:%SZ)
          echo "Pruning workflow runs older than $cutoff"
          gh api "repos/$REPO/actions/runs?per_page=100&status=completed" --paginate --jq \
            ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" | while read -r id; do
            echo "Deleting run $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done
