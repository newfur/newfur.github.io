name: Clean Artifacts

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete artifacts older than N days'
        required: false
        default: '7'
        type: string

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Clean Up Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeDays = parseInt('${{ inputs.max_age_days }}') || 7;
            const cutoff = Date.now() - maxAgeDays * 24 * 60 * 60 * 1000;
            let deleted = 0;
            let freedBytes = 0;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at).getTime();
              if (createdAt < cutoff) {
                console.log(`Deleting: ${artifact.name} (${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MB, created ${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                freedBytes += artifact.size_in_bytes;
                deleted++;
              }
            }

            console.log(`\n✅ Done! Deleted ${deleted} artifacts, freed ~${(freedBytes / 1024 / 1024).toFixed(1)} MB`);
