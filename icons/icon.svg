<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient: Deep Royal Blue to Indigo to Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    
    <!-- Glossy Dome Reflection Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Page Shading Gradient (Left Page: Darker at the spine on the right) -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Page Shading Gradient (Right Page: Darker at the spine on the left) -->
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="15%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Red Bookmark Gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    
    <!-- Book Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Background -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGrad)" />

  <!-- Inner Bevel Highlight (Slight ring inside the circle at the top) -->
  <path d="M 40,256 A 216,216 0 0,1 472,256" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" stroke-linecap="round" />

  <!-- Book Cover Backing (Dark Blue/Grey with Shadow) -->
  <g filter="url(#dropShadow)">
    <polygon points="104,168 250,192 250,368 104,344" fill="#0f172a" />
    <polygon points="262,192 408,168 408,344 262,368" fill="#0f172a" />
    
    <!-- Bookmark Ribbon -->
    <polygon points="248,180 264,180 264,395 256,382 248,395" fill="url(#bookmarkGrad)" />
    
    <!-- Left Page -->
    <polygon points="114,176 246,198 246,360 114,338" fill="url(#leftPageGrad)" />
    <!-- Right Page -->
    <polygon points="266,198 398,176 398,338 266,360" fill="url(#rightPageGrad)" />
    
    <!-- Left Page Lines (Cyan/Blue Gradient or Solid color) -->
    <line x1="138" y1="215" x2="222" y2="230" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    <line x1="138" y1="250" x2="198" y2="260" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    <line x1="138" y1="285" x2="222" y2="300" stroke="#3b82f6" stroke-width="7" stroke-linecap="round" />
    
    <!-- Right Page Lines (Pink/Magenta) -->
    <line x1="290" y1="230" x2="374" y2="215" stroke="#ec4899" stroke-width="7" stroke-linecap="round" />
    <line x1="290" y1="260" x2="350" y2="250" stroke="#ec4899" stroke-width="7" stroke-linecap="round" />
    <line x1="290" y1="290" x2="374" y2="275" stroke="#ec4899" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Glossy Dome Reflection Overlay -->
  <path d="M 38,230 A 220,220 0 0,1 474,230 C 350,330 150,330 38,230 Z" fill="url(#glossGrad)" />
</svg>
