<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Vibrant Modern Indigo to Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Accent Bookmark Ribbon Gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Square (Flat and Modern) -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" />

  <!-- Book Cover Backing (Dark Navy/Indigo) -->
  <g>
    <!-- Left Cover Backing -->
    <path d="M 246 166 C 196 151, 134 151, 92 168 L 92 350 C 134 333, 196 333, 246 350 Z" fill="#1e1b4b" />
    <!-- Right Cover Backing -->
    <path d="M 266 166 C 316 151, 378 151, 420 168 L 420 350 C 378 333, 316 333, 266 350 Z" fill="#1e1b4b" />
  </g>

  <!-- Bookmark Ribbon (Vibrant Coral Red) -->
  <path d="M 250 170 L 262 170 L 262 375 L 256 363 L 250 375 Z" fill="url(#bookmarkGrad)" />

  <!-- Book Pages (Pure White) -->
  <g>
    <!-- Left Page -->
    <path d="M 244 176 C 200 161, 140 161, 100 176 L 100 346 C 140 331, 200 331, 244 346 Z" fill="#ffffff" />
    <!-- Right Page -->
    <path d="M 268 176 C 312 161, 372 161, 412 176 L 412 346 C 372 331, 312 331, 268 346 Z" fill="#ffffff" />
  </g>

  <!-- Symmetrical Text Lines (Subtle slate lines simulating text) -->
  <g stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- Left Page Lines -->
    <path d="M 130 220 C 160 210, 190 215, 214 226" />
    <path d="M 130 252 C 160 242, 180 246, 194 251" />
    <path d="M 130 284 C 160 274, 190 279, 214 290" />

    <!-- Right Page Lines -->
    <path d="M 298 226 C 322 215, 352 210, 382 220" />
    <path d="M 298 251 C 322 246, 342 242, 362 247" />
    <path d="M 298 290 C 322 279, 352 274, 382 284" />
  </g>
</svg>
